# Упрощённый запуск без PostgreSQL (H2 in-memory в API).
#   docker compose -f docker-compose.dev.yml up --build -d
name: taskmanager-dev

services:
  api:
    build:
      context: ./Task_Manager_API
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-at-least-256-bit-secret-key-here}
    restart: unless-stopped

  web-spa:
    build:
      context: ./clients/web-spa
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cli:
    build:
      context: ./clients/cli
    environment:
      TM_API_BASE: http://api:8080/api/v1
      HOME: /data
    volumes:
      - cli-data:/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  cli-data:
