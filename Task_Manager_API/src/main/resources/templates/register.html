<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="eyebrow">Task Manager</div>
        <h1 class="h3 mb-2">Создать аккаунт</h1>
        <p class="text-muted mb-4">Один аккаунт для Web, Android и CLI.</p>
        <div id="alert"></div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label" for="name">Имя</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Пароль (мин. 6)</label>
                <input type="password" class="form-control" id="password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
        </form>
        <p class="mt-3 mb-0 text-center text-muted">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>
</div>
<script src="/js/api.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const data = await apiFetch('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            setToken(data.token);
            window.location.href = '/projects';
        } catch (err) {
            showAlert('alert', err.message);
        }
    });
</script>
</body>
</html>
