databaseChangeLog:
  - changeSet:
      id: 012-project-risks
      author: taskmanager
      changes:
        - createTable:
            tableName: project_risks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_risks_project
                    references: projects(id)
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_risks_task
                    references: tasks(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: unblock_at
                  type: DATE
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
