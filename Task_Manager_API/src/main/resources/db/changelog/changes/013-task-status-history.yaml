databaseChangeLog:
  - changeSet:
      id: 013-task-status-history
      author: taskmanager
      changes:
        - createTable:
            tableName: task_status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_status_hist_task
                    references: tasks(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: entered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: left_at
                  type: TIMESTAMP
