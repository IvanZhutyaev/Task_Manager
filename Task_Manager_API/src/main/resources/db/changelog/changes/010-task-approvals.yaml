databaseChangeLog:
  - changeSet:
      id: 010-task-approvals
      author: taskmanager
      changes:
        - createTable:
            tableName: task_approvals
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_approvals_task
                    references: tasks(id)
              - column:
                  name: approver_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_approvals_user
                    references: users(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(2000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
