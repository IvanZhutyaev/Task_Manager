databaseChangeLog:
  - changeSet:
      id: 008-project-workflow-transitions
      author: taskmanager
      changes:
        - createTable:
            tableName: project_workflow_transitions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workflow_project
                    references: projects(id)
              - column:
                  name: from_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: to_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: project_workflow_transitions
            columnNames: project_id, from_status, to_status
            constraintName: uq_workflow_transition
