name: taskmanager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend + встроенный Demo UI (Thymeleaf) на :8080
  api:
    build:
      context: ./Task_Manager_API
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskmanager}
      DB_USER: ${POSTGRES_USER:-taskmanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-at-least-256-bit-secret-key-here}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Браузерный клиент
  web-spa:
    build:
      context: ./clients/web-spa
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # CLI-клиент (Python). После up — контейнер живёт для exec/run.
  # Примеры:
  #   docker compose exec cli tm health
  #   docker compose run --rm --entrypoint tm cli login --email u@ex.com --password secret12
  cli:
    build:
      context: ./clients/cli
    environment:
      TM_API_BASE: http://api:8080/api/v1
      HOME: /data
    volumes:
      - cli-data:/data
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  pgdata:
  cli-data:
